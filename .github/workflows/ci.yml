name: CI

on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build needs these present; CI uses placeholders (no secrets required).
          GOOGLE_OAUTH_ID: dummy
          GOOGLE_OAUTH_SECRET: dummy
          NEXTAUTH_SECRET: dummy-ci-secret
          NEXTAUTH_URL: http://localhost:3000
          SANITY_STUDIO_SANITY_PROJECT_ID: dummy
          SANITY_STUDIO_SANITY_DATASET: production
          SANITY_SECRET_TOKEN: dummy

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # Playwright builds + starts the app (placeholders below); session cookies
        # are minted with AUTH_SECRET, so the value just has to match the server's.
        run: npm run test:e2e
        env:
          AUTH_SECRET: e2e-ci-secret
